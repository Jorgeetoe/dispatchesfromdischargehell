<!-- Custom schema enhancement -->
<!-- jekyll-seo-tag generates WebSite and BlogPosting schemas from site config. -->
<!-- This section adds/corrects schemas for better E-E-A-T signals. -->

<!-- Correct WebSite schema name (jekyll-seo-tag uses site.social.name which is the author, not site name) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.title }}",
  "alternateName": "{{ site.sidebar_tagline }}",
  "url": "{{ site.url }}"
}
</script>

{% if (page.layout == 'page' or page.layout == 'about') and (page.title == 'About' or page.title == 'About Jorge Arenivar') %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jorge Arenivar",
    "jobTitle": "Registered Nurse, Certified Case Manager",
    "description": "Catastrophic neurorehabilitation case manager with 20+ years in discharge planning, insurance advocacy, and family conferences.",
    "url": "{{ site.url | append: '/about/' }}",
    "sameAs": [
      "https://www.linkedin.com/in/jorgearenivar/",
      "https://twitter.com/JorgeArenivar",
      "https://www.facebook.com/jorge.arenivar"
    ],
    "knowsAbout": ["Discharge Planning", "Catastrophic Injury", "Neurorehabilitation", "Insurance Authorization", "Case Management"],
    "credential": [
      "BSN - Bachelor of Science in Nursing",
      "RN - Registered Nurse",
      "CCM - Certified Case Manager",
      "CRRN - Certified Rehabilitation Registered Nurse"
    ]
  }
  </script>
{% endif %}
