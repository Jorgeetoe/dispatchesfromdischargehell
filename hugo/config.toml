baseURL = "https://dispatchesfromdischargehell.com/"
languageCode = "en-us"
title = "Dispatches from Discharge Hell"
defaultContentLanguage = "en"
theme = "blowfish"

# Content handling
removePathAccents = true
uglyURLs = false
canonifyURLs = true

# Output settings
[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML", "RSS"]

# Taxonomies
[taxonomies]
category = "categories"
series = "series"

# Menu
[menu]
[[menu.main]]
name = "Start Here"
url = "/start-here/"
weight = 1
[[menu.main]]
name = "Blog / Writing"
url = "/blog/"
weight = 2
[[menu.main]]
name = "About"
url = "/about/"
weight = 3
[[menu.main]]
name = "Telos"
url = "/telos/"
weight = 4
[[menu.main]]
name = "Subscribe"
url = "/subscribe/"
weight = 5

# Footer menu
[[menu.footer]]
name = "Subscribe"
url = "/subscribe/"
weight = 1
[[menu.footer]]
name = "About"
url = "/about/"
weight = 2
[[menu.footer]]
name = "RSS"
url = "/index.xml"
weight = 3

# Parameters
[params]
readingTime = true
words_per_minute = 238
description = "What actually happens when insurance runs out and the hospital needs your bed. 20+ years in catastrophic neurorehabilitation case management."

# Author (Blowfish format)
[params.author]
name = "Jorge Arenivar"
link = "/about/"

# Blowfish theme config
colourScheme = "light"
showReadingTime = true
showDate = true
showSummary = true
showTableOfContents = true
showTaxonomyTag = true

# Social links
[params.social]
linkedin = "https://linkedin.com/in/jorgearenivar"
twitter = "https://twitter.com/JorgeArenivar"
facebook = "https://facebook.com/dispatchesfromdischargehell"
