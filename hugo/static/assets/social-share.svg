<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#B33A2B"/>

  <!-- Subtle pattern overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9A3025" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Large D logo -->
  <text x="600" y="280" font-family="Georgia, serif" font-size="220" font-weight="bold" fill="white" text-anchor="middle" opacity="0.15">D</text>

  <!-- Main title -->
  <text x="600" y="260" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">Dispatches from</text>
  <text x="600" y="340" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">Discharge Hell</text>

  <!-- Tagline -->
  <text x="600" y="420" font-family="Source Sans Pro, Helvetica, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">What actually happens when insurance runs out</text>
  <text x="600" y="455" font-family="Source Sans Pro, Helvetica, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">and the hospital needs your bed.</text>

  <!-- Author credit -->
  <text x="600" y="540" font-family="Source Sans Pro, Helvetica, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.7">Jorge Arenivar, RN, CCM, CRRN — 20+ years in catastrophic care</text>

  <!-- Decorative line -->
  <rect x="450" y="480" width="300" height="2" fill="white" opacity="0.4"/>
</svg>
